name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw clean verify


  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
  security:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t agendastyle-backend:ci ./backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
           image-ref: agendastyle-backend:ci
           format: table
           severity: HIGH,CRITICAL
           ignore-unfixed: true
           exit-code: 1
      - name: Build frontend Docker image
        run: docker build -t agendastyle-frontend:ci --build-arg VITE_API_URL=http://localhost:8080 ./frontend

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agendastyle-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-south-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/agendastyle-backend:$IMAGE_TAG" \
            ./backend

          docker push \
            "$ECR_REGISTRY/agendastyle-backend:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/agendastyle-frontend:$IMAGE_TAG" \
            ./frontend

          docker push \
            "$ECR_REGISTRY/agendastyle-frontend:$IMAGE_TAG"
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-south-2

      - name: Deploy with AWS Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PARAMETERS=$(jq -n --arg tag "$IMAGE_TAG" '{
            commands: [
              "set -e",
              "cd /opt/agendastyle",
              ("sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=" + $tag + "/\" .env"),
              "BACKEND_ECR=$(grep \"^BACKEND_ECR=\" .env | cut -d= -f2-)",
              "REGISTRY=${BACKEND_ECR%%/*}",
              "aws ecr get-login-password --region eu-south-2 | docker login --username AWS --password-stdin \"$REGISTRY\"",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d",
              "for i in $(seq 1 12); do if curl -fsS http://localhost:5173/api/v1/services >/dev/null; then echo \"Smoke test passed\"; exit 0; fi; sleep 5; done; echo \"Smoke test failed\"; exit 1"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region eu-south-2 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region eu-south-2
          then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region eu-south-2 || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region eu-south-2 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'